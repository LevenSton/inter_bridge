<text x="40.0" y="912.0" font-size="12.5" fill="#4b5563" text-anchor="start">两边金库的净差额由再平衡服务通过 CCTP / CEX 批量调拨，成本算进平台费。卖出的收费方式参考 Pump：bps + gas 实报实销。</text>
<text x="40.0" y="934.0" font-size="12.5" fill="#4b5563" text-anchor="start">小额订单要设最低费用或最低下单金额，否则固定成本会吃掉利润（Pump 1 USDC 订单的来回损耗约 10%）。</text>
