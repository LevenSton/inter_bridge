<text x="620.0" y="937.8" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">安全点 2：金库限额 + 暂停</text>
<text x="620.0" y="956.0" font-size="12" fill="#4b5563" text-anchor="middle">单笔 / 单日上限，提款要多签 + 时间锁</text>
