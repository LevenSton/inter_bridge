<text x="225.3" y="937.8" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">安全点 1：密钥只签白名单</text>
<text x="225.3" y="956.0" font-size="12" fill="#4b5563" text-anchor="middle">金库、聚合器、7702 合约以外一律拒签</text>
