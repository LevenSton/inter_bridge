<text x="40.0" y="46.0" font-size="22" fill="#1f2937" text-anchor="start" font-weight="700">图 12  跨链订单路由决策</text>
<text x="40.0" y="74.0" font-size="13" fill="#4b5563" text-anchor="start">从上往下依次判断；任何一步不满足都不会出现“买不了”，只会走 Relay 或拆单</text>
<rect x="330" y="100" width="340" height="58" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="500.0" y="133.6" font-size="14.5" fill="#1f2937" text-anchor="middle" font-weight="700">跨链订单：A 链 → B 链，金额 M</text>
<polygon points="500,190.0 690.0,238 500,286.0 310.0,238" fill="#fdf3d7" stroke="#b7791f" stroke-width="2"/>
<text x="500.0" y="242.7" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="700">A、B 都有我们的金库？</text>
<polygon points="500,330.0 690.0,378 500,426.0 310.0,378" fill="#fdf3d7" stroke="#b7791f" stroke-width="2"/>
<text x="500.0" y="382.6" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="700">B 金库余额 ≥ M × 安全系数？</text>
<polygon points="500,470.0 690.0,518 500,566.0 310.0,518" fill="#fdf3d7" stroke="#b7791f" stroke-width="2"/>
<text x="500.0" y="522.7" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="700">限额 / 风控通过？</text>
<rect x="370" y="610" width="260" height="58" rx="10" fill="#efeafd" stroke="#6d28d9" stroke-width="2"/>
<text x="500.0" y="634.9" font-size="14.5" fill="#1f2937" text-anchor="middle" font-weight="700">走自营库存桥</text>
<text x="500.0" y="653.3" font-size="12" fill="#4b5563" text-anchor="middle">1~2 s · 收 bps + gas</text>
<polygon points="500,700.0 690.0,748 500,796.0 310.0,748" fill="#fdf3d7" stroke="#b7791f" stroke-width="2"/>
<text x="500.0" y="752.7" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="700">目标链执行成功？</text>
