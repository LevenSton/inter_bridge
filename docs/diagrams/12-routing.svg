<text x="865.0" y="295.2" font-size="14.5" fill="#1f2937" text-anchor="middle" font-weight="700">走 Relay</text>
<text x="865.0" y="313.6" font-size="12" fill="#4b5563" text-anchor="middle">服务端代签 · gasless</text>
<text x="865.0" y="331.0" font-size="12" fill="#4b5563" text-anchor="middle">慢一点，但一定能买</text>
<rect x="40" y="488" width="190" height="60" rx="10" fill="#fde7e7" stroke="#b91c1c" stroke-width="2"/>
<text x="135.0" y="522.6" font-size="14.5" fill="#1f2937" text-anchor="middle" font-weight="700">拒绝或拆单</text>
