<text x="40.0" y="46.0" font-size="22" fill="#1f2937" text-anchor="start" font-weight="700">图 3  Relay 资金流转与费用（通用模型）</text>
<text x="40.0" y="74.0" font-size="13" fill="#4b5563" text-anchor="start">实线 = 资金移动　虚线 = 事件 / 事后结算　红色 = 从报价里扣掉的费用　实测金额见图 7</text>
<rect x="62" y="140" width="268" height="62" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="196.0" y="166.8" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">用户 Solana 钱包</text>
<text x="196.0" y="185.0" font-size="12" fill="#4b5563" text-anchor="middle">付出 X（SOL / USDC）</text>
<rect x="62" y="266" width="268" height="62" rx="10" fill="#e8effc" stroke="#1d4ed8" stroke-width="2"/>
<text x="196.0" y="292.8" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">Relay Depository · Solana</text>
<text x="196.0" y="311.0" font-size="12" fill="#4b5563" text-anchor="middle">锁定 X，等 Solver 事后来取</text>
<rect x="62" y="392" width="268" height="62" rx="10" fill="#dcf5ef" stroke="#0f766e" stroke-width="2"/>
<text x="196.0" y="418.8" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">Solver（BSC 上的库存）</text>
<text x="196.0" y="437.0" font-size="12" fill="#4b5563" text-anchor="middle">垫付 X − 各项费用</text>
<rect x="62" y="518" width="268" height="62" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="196.0" y="544.8" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">BSC DEX / 聚合器</text>
<text x="196.0" y="563.0" font-size="12" fill="#4b5563" text-anchor="middle">USDC → BNB → meme</text>
<rect x="62" y="644" width="268" height="62" rx="10" fill="#e3f5dc" stroke="#2f7d32" stroke-width="2"/>
<text x="196.0" y="670.8" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">用户 BSC 地址</text>
<text x="196.0" y="689.0" font-size="12" fill="#4b5563" text-anchor="middle">收到 meme</text>
<text x="116.0" y="230.0" font-size="12" fill="#1d4ed8" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">存款（用户付 SOL gas，</text>
<text x="116.0" y="246.0" font-size="12" fill="#1d4ed8" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">或 gasless 计入报价）</text>
<text x="116.0" y="364.0" font-size="12" fill="#1d4ed8" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">触发填单</text>
<text x="302.0" y="364.0" font-size="12" fill="#c2410c" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"></text>
<text x="284.0" y="364.0" font-size="12" fill="#c2410c" text-anchor="end" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">事后回款</text>
<text x="116.0" y="490.0" font-size="12" fill="#1d4ed8" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">USDC</text>
<text x="116.0" y="616.0" font-size="12" fill="#1d4ed8" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">meme</text>
<rect x="382" y="228" width="210" height="46" rx="10" fill="#fde7e7" stroke="#b91c1c" stroke-width="2"/>
<text x="487.0" y="247.0" font-size="12.5" fill="#1f2937" text-anchor="middle" font-weight="700">Execution</text>
<text x="487.0" y="263.6" font-size="11" fill="#4b5563" text-anchor="middle">$0.02 固定 + 目标链 gas</text>
<rect x="382" y="284" width="210" height="46" rx="10" fill="#fde7e7" stroke="#b91c1c" stroke-width="2"/>
<text x="487.0" y="303.0" font-size="12.5" fill="#1f2937" text-anchor="middle" font-weight="700">Swap Cost</text>
<text x="487.0" y="319.6" font-size="11" fill="#4b5563" text-anchor="middle">DEX 费 + 冲击 + 再平衡</text>
<rect x="382" y="340" width="210" height="46" rx="10" fill="#fde7e7" stroke="#b91c1c" stroke-width="2"/>
<text x="487.0" y="359.0" font-size="12.5" fill="#1f2937" text-anchor="middle" font-weight="700">Relay 平台费</text>
<text x="487.0" y="375.6" font-size="11" fill="#4b5563" text-anchor="middle">meme 属于长尾币：0.15%</text>
<rect x="382" y="396" width="210" height="46" rx="10" fill="#efeafd" stroke="#6d28d9" stroke-width="2"/>
<text x="487.0" y="415.0" font-size="12.5" fill="#1f2937" text-anchor="middle" font-weight="700">App Fee</text>
<text x="487.0" y="431.6" font-size="11" fill="#4b5563" text-anchor="middle">集成方自定 bps</text>
<rect x="382" y="452" width="210" height="46" rx="10" fill="#fde8dc" stroke="#c2410c" stroke-width="2"/>
<text x="487.0" y="471.0" font-size="12.5" fill="#1f2937" text-anchor="middle" font-weight="700">结算 ≈ $0.005 / 单</text>
<text x="487.0" y="487.6" font-size="11" fill="#4b5563" text-anchor="middle">Solver 承担，算进报价</text>
<text x="382.0" y="220.0" font-size="11.5" fill="#4b5563" text-anchor="start">从 X 里扣掉</text>
<rect x="672" y="140" width="268" height="62" rx="10" fill="#e3f5dc" stroke="#2f7d32" stroke-width="2"/>
<text x="806.0" y="166.8" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">用户 BSC 地址</text>
<text x="806.0" y="185.0" font-size="12" fill="#4b5563" text-anchor="middle">持有 meme</text>
<rect x="672" y="266" width="268" height="62" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="806.0" y="292.8" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">BSC DEX（源链 swap）</text>
<text x="806.0" y="311.0" font-size="12" fill="#4b5563" text-anchor="middle">meme → USDC</text>
<rect x="672" y="392" width="268" height="62" rx="10" fill="#e8effc" stroke="#1d4ed8" stroke-width="2"/>
<text x="806.0" y="418.8" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">Relay Depository · BSC</text>
<text x="806.0" y="437.0" font-size="12" fill="#4b5563" text-anchor="middle">锁定 USDC</text>
<rect x="672" y="518" width="268" height="62" rx="10" fill="#dcf5ef" stroke="#0f766e" stroke-width="2"/>
<text x="806.0" y="544.8" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">Solver（Solana 上的库存）</text>
<text x="806.0" y="563.0" font-size="12" fill="#4b5563" text-anchor="middle">支付 USDC − 各项费用</text>
<rect x="672" y="644" width="268" height="62" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="806.0" y="670.8" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">用户 Solana 钱包</text>
<text x="806.0" y="689.0" font-size="12" fill="#4b5563" text-anchor="middle">收到 USDC / SOL</text>
<text x="726.0" y="230.0" font-size="12" fill="#c2410c" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">需要 BNB gas</text>
<text x="726.0" y="246.0" font-size="12" fill="#c2410c" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">（或 7702 / permit 免 gas）</text>
<text x="726.0" y="364.0" font-size="12" fill="#c2410c" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">USDC 存款</text>
<text x="726.0" y="490.0" font-size="12" fill="#c2410c" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">存款事件 → 触发付款</text>
<text x="726.0" y="616.0" font-size="12" fill="#c2410c" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">USDC</text>
<rect x="992" y="266" width="210" height="46" rx="10" fill="#fde7e7" stroke="#b91c1c" stroke-width="2"/>
<text x="1097.0" y="285.0" font-size="12.5" fill="#1f2937" text-anchor="middle" font-weight="700">Swap Cost（源链）</text>
<text x="1097.0" y="301.6" font-size="11" fill="#4b5563" text-anchor="middle">DEX 费 + 价格冲击</text>
<rect x="992" y="470" width="210" height="46" rx="10" fill="#fde7e7" stroke="#b91c1c" stroke-width="2"/>
<text x="1097.0" y="489.0" font-size="12.5" fill="#1f2937" text-anchor="middle" font-weight="700">Execution + 平台费</text>
<text x="1097.0" y="505.6" font-size="11" fill="#4b5563" text-anchor="middle">$0.02 + gas + bps</text>
<rect x="992" y="526" width="210" height="46" rx="10" fill="#efeafd" stroke="#6d28d9" stroke-width="2"/>
<text x="1097.0" y="545.0" font-size="12.5" fill="#1f2937" text-anchor="middle" font-weight="700">App Fee</text>
<text x="1097.0" y="561.6" font-size="11" fill="#4b5563" text-anchor="middle">集成方自定 bps</text>
<text x="40.0" y="754.0" font-size="12.5" fill="#4b5563" text-anchor="start">卖出时“任意币 → USDC”发生在源链：用户要先在 BSC 上完成一次 swap 再存款，比买入多一段链路。</text>
</svg>
