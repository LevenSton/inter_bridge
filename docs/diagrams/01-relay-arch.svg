<text x="990.0" y="278.9" font-size="14.5" fill="#1f2937" text-anchor="middle" font-weight="700">DEX / 聚合器</text>
<text x="990.0" y="297.3" font-size="12" fill="#4b5563" text-anchor="middle">KyberSwap 等 · USDC → BNB → meme</text>
<rect x="860" y="372" width="260" height="60" rx="10" fill="#e3f5dc" stroke="#2f7d32" stroke-width="2"/>
