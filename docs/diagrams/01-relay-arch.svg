<text x="210.0" y="147.3" font-size="12" fill="#4b5563" text-anchor="middle">发起下单 · 展示报价</text>
<rect x="480" y="102" width="320" height="62" rx="10" fill="#fdf3d7" stroke="#b7791f" stroke-width="2"/>
