<text x="1000.0" y="347.0" font-size="12" fill="#1d4ed8" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">meme 到账</text>
<text x="405.0" y="434.0" font-size="12" fill="#c2410c" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">⑧ 取回存款</text>
<rect x="80" y="582" width="280" height="74" rx="10" fill="#fde8dc" stroke="#c2410c" stroke-width="2"/>
<text x="220.0" y="606.2" font-size="14.5" fill="#1f2937" text-anchor="middle" font-weight="700">Relay Chain · Hub</text>
<text x="220.0" y="624.6" font-size="12" fill="#4b5563" text-anchor="middle">ERC6909 账本：MINT / TRANSFER / BURN</text>
<text x="220.0" y="642.0" font-size="12" fill="#4b5563" text-anchor="middle">约 $0.005 / 单</text>
<rect x="460" y="582" width="280" height="74" rx="10" fill="#fde8dc" stroke="#c2410c" stroke-width="2"/>
<text x="600.0" y="606.2" font-size="14.5" fill="#1f2937" text-anchor="middle" font-weight="700">Oracle</text>
<text x="600.0" y="624.6" font-size="12" fill="#4b5563" text-anchor="middle">读两条链，核对存款与填单</text>
<text x="600.0" y="642.0" font-size="12" fill="#4b5563" text-anchor="middle">签发 EIP-712 证明</text>
<rect x="840" y="582" width="280" height="74" rx="10" fill="#fde8dc" stroke="#c2410c" stroke-width="2"/>
<text x="980.0" y="606.2" font-size="14.5" fill="#1f2937" text-anchor="middle" font-weight="700">Allocator @ Aurora</text>
<text x="980.0" y="624.6" font-size="12" fill="#4b5563" text-anchor="middle">NEAR MPC 网络</text>
<text x="980.0" y="642.0" font-size="12" fill="#4b5563" text-anchor="middle">签发提款证明</text>
<text x="608.0" y="552.0" font-size="12" fill="#c2410c" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">④ 请求证明</text>
<text x="365.0" y="486.0" font-size="12" fill="#c2410c" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">读存款</text>
<text x="835.0" y="486.0" font-size="12" fill="#c2410c" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">读填单</text>
<text x="410.0" y="611.0" font-size="12" fill="#c2410c" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">⑤ 记账</text>
<text x="600.0" y="698.0" font-size="12" fill="#c2410c" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">⑥ 提款：Hub 余额销毁 → 申请 MPC 证明</text>
<text x="1068.0" y="552.0" font-size="12" fill="#c2410c" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">⑦ MPC 提款证明</text>
<text x="40.0" y="758.0" font-size="12.5" fill="#4b5563" text-anchor="start">用户等待的只有蓝色部分；橙色部分决定 Solver 的资金被占用多久，这部分成本最终会算进报价。</text>
</svg>
