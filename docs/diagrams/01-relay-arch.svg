<text x="600.0" y="347.6" font-size="12" fill="#4b5563" text-anchor="middle">· 模拟填单（不行就退款）</text>
<text x="600.0" y="365.0" font-size="12" fill="#4b5563" text-anchor="middle">· 用自有资金在目标链填单</text>
<text x="600.0" y="382.4" font-size="12" fill="#4b5563" text-anchor="middle">多链库存：USDC / ETH / BNB …</text>
