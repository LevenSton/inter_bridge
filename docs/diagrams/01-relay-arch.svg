<text x="40.0" y="46.0" font-size="22" fill="#1f2937" text-anchor="start" font-weight="700">图 1  Relay 协议架构（以 Solana 上的币 → BSC meme 为例）</text>
<text x="40.0" y="74.0" font-size="13" fill="#4b5563" text-anchor="start">蓝色 = 执行路径（用户在等的部分）　橙色 = Solver 事后结算回款（异步，用户无感）　虚线 = 监听 / 读取</text>
<rect x="60" y="102" width="300" height="62" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
