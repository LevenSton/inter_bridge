<text x="990.0" y="416.3" font-size="12" fill="#4b5563" text-anchor="middle">收到 meme</text>
<text x="220.0" y="200.0" font-size="12" fill="#4b5563" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">用户签名并发送</text>
<text x="220.0" y="347.0" font-size="12" fill="#1d4ed8" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">存款 + orderId</text>
