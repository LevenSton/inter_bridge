<text x="210.0" y="297.3" font-size="12" fill="#4b5563" text-anchor="middle">SOL / USDC · 需自付 SOL gas</text>
<rect x="80" y="372" width="260" height="60" rx="10" fill="#e8effc" stroke="#1d4ed8" stroke-width="2"/>
