<text x="210.0" y="416.3" font-size="12" fill="#4b5563" text-anchor="middle">托管用户存款 · 记录 orderId</text>
<rect x="470" y="262" width="260" height="160" rx="10" fill="#dcf5ef" stroke="#0f766e" stroke-width="2"/>
<text x="600.0" y="311.8" font-size="14.5" fill="#1f2937" text-anchor="middle" font-weight="700">Solver</text>
