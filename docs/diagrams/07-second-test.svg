<text x="40.0" y="842.0" font-size="13" fill="#1f2937" text-anchor="start" font-weight="600">结论：Pump 现在是混合路由。用 USDC 买走 Pump Bridge，用 SOL 买仍然走 Relay，卖出一律走 Pump Bridge。</text>
<text x="40.0" y="868.0" font-size="12.5" fill="#4b5563" text-anchor="start">走 Relay 时 Pump 几乎赚不到钱，走自营时能收 0.45% + 约 $0.05，这是 Pump 把路由收回自己手里的直接原因。</text>
